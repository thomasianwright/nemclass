[package]
name = "nemclass"
version = "0.1.0"
edition = "2021"
description = "Inspect and recreate in-memory data structures"
license = "MIT"
authors = ["ItsEthra"]
repository = "https://github.com/ItsEthra/yclass"
readme = "README.md"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
nemclass_memory = { path = "crates/nemclass_memory" }
nemclass_sdk = { path = "crates/nemclass_sdk" }
nemclass_scripting = { path = "crates/nemclass_scripting" }

[dependencies]
nemclass_memory = { workspace = true, features = ["external"] }
nemclass_sdk = { workspace = true }
nemclass_scripting = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
egui_extras = "0.34"
egui-notify = "0.22"
once_cell = "1.16"
fastrand = "2.4.1"
eframe = "0.34"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
arboard = "3"
rayon = "1.6"
toml = "1.1.3+spec-1.1.0"
eyre = "0.6"
dirs = "6.0.0"
rfd = "0.17.2"
ron = "0.12.2"
