# The egui GUI (root `src/`) has been retired in favour of the Tauri + React UI
# under `src-tauri/` (binary `nemclass_tauri`). The old `src/` tree is kept on
# disk only as a porting reference (spider algorithm, Lua completions) and is no
# longer part of the workspace build.
[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.dependencies]
nemclass_memory = { path = "crates/nemclass_memory" }
nemclass_sdk = { path = "crates/nemclass_sdk" }
nemclass_scripting = { path = "crates/nemclass_scripting" }
