[package]
name = "nemclass_sdk"
version = "0.1.0"
edition = "2021"
description = "Headless SDK for nemclass: process targets, patterns, offsets, type schemas."
license = "MIT"

[dependencies]
nemclass_memory = { workspace = true, features = ["external"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.2"
toml = "1.1"
thiserror = "2"
libloading = "0.9.0"
libc = "0.2"
nix = { version = "0.29", features = [
    "ptrace",
    "process",
    "signal",
    "uio",
    "personality",
], optional = true }
frida = { version = "0.17", features = ["auto-download"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# The native ptrace debugger + hardware-watchpoint access tracer. On by default:
# it only pulls `nix` (already in the tree) and gives the GUI a working debugger.
default = ["debug-ptrace"]
# Raw-ptrace debugger backend (breakpoints, registers, single-step, HW watchpoints).
debug-ptrace = ["dep:nix"]
# Frida-backed debugger/instrumentation backend. Off by default: enabling it pulls
# the `frida` crate, whose build downloads the frida-gum devkit (needs network).
frida = ["dep:frida", "dep:serde_json"]
# LibIHT (LBR) "find what accesses" tracer. Pure `libc` FFI to the kernel module;
# compiles anywhere, but needs the libiht kernel module loaded at runtime.
libiht = []
# Intel PT "find what accesses" tracer via perf_event_open. Pure `libc`; needs a
# PT-capable CPU and perf permissions at runtime.
intel-pt = []
# Everything.
full = ["debug-ptrace", "frida", "libiht", "intel-pt"]

[[example]]
name = "scan_demo"
required-features = ["debug-ptrace"]

[[example]]
name = "debug_demo"
required-features = ["debug-ptrace"]

[[example]]
name = "find_what_writes"
required-features = ["debug-ptrace"]
