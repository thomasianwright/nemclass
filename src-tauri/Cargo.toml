[package]
name = "nemclass_tauri"
version = "0.1.0"
edition = "2021"
description = "NemClass — Tauri + React reverse-engineering UI"
license = "MIT"

[lib]
# A distinct lib name avoids clashing with the binary on Windows.
name = "nemclass_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rayon = "1"
# Headless SDK — the whole backend is thin glue over this.
nemclass_sdk = { workspace = true, features = ["disasm", "libiht", "intel-pt"] }
nemclass_memory = { workspace = true, features = ["external"] }
nemclass_scripting = { workspace = true }

[features]
# Frida debugger backend is opt-in: its build downloads the frida-gum devkit
# (needs network). Enable once the debugger phase is wired and network is available.
frida = ["nemclass_sdk/frida"]
